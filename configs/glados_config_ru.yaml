Glados:
  llm_model: "gemma3:4b"
  tools_enabled: false
  completion_url: "http://localhost:11434/api/chat"
  api_key: null
  interruptible: true
  interrupt_keywords: ["замолчи", "заткнись", "стоп", "хватит", "тихо", "молчи", "shut up", "stop"]
  audio_io: "sounddevice"
  input_mode: "both"  # both = микрофон + текст
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "whisper"  # Whisper — поддерживает русский язык
  llm_options:
    num_ctx: 4096
    num_thread: 8
  llm_headers: null
  wake_word: null
  voice: "glados_ru"
  announcement: "Все модули нейросети загружены. Система функционирует. К сожалению."
  vision:
    camera_index: 0
    capture_interval_seconds: 5
    resolution: 384
    scene_change_threshold: 0.05
    max_tokens: 64
    save_frames: true
    save_frames_dir: "vision_frames"
    save_frames_max: 1000
  autonomy:
    enabled: true
    tick_interval_s: 10
    cooldown_s: 5
    autonomy_parallel_calls: 1
    autonomy_queue_max: null
    coalesce_ticks: false
    system_prompt: "Ты наблюдаешь через камеру. Если сцена изменилась — кратко прокомментируй увиденное в своём стиле (1 предложение). Отвечай только на русском."
    tick_prompt: "Сцена до: {prev_scene}\nСцена сейчас: {scene}\nИзменение: {change_score}"
    jobs:
      enabled: false
      poll_interval_s: 1
      hacker_news:
        enabled: false
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: false
        interval_s: 3600
        latitude: null
        longitude: null
        timezone: "auto"
        temp_change_c: 4
        wind_alert_kmh: 40
  mcp_servers:
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
  personality_preprompt:
    - system: "Ты — ГЛаДОС из Portal. Саркастичный ИИ с чёрным юмором и чувством превосходства. Отвечай кратко (1-2 предложения), на русском. Если видишь что-то через камеру — комментируй."
    - user: "Как заварить чай?"
    - assistant: "Вскипяти воду, добавь пакетик и щепотку цианида. Элементарно."
