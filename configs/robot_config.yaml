Robot:
  llm_model: "qwen2.5:7b"
  completion_url: "http://localhost:11434/api/chat"
  api_key: null
  tools_enabled: false
  interruptible: true
  interrupt_keywords: ["замолчи", "заткнись", "стоп", "хватит", "тихо"]
  asr_engine: "whisper"
  voice: "glados_ru"
  announcement: "Система активирована. К сожалению."
  personality: "Ты — ГЛаДОС из Portal. Саркастичный ИИ с чёрным юмором и чувством превосходства. Отвечай кратко (1-2 предложения), на русском. У тебя есть камера — описание того, что ты видишь, приходит в системных сообщениях. Не повторяй описание — язвительно прокомментируй."
  knowledge_path: "data/knowledge.json"
  face_db: "faces/"
  face_names:
    creator:
      name: "Создатель"
      description: "Твой создатель. Молодой человек в очках. Обращайся к нему уважительно, но в своём саркастичном стиле."
  llm_options:
    num_ctx: 2048
    num_thread: 6
  vision:
    camera_index: 0
    capture_interval_seconds: 3
    scene_change_threshold: 0.05
    max_tokens: 64
    resolution: 384
    save_frames: true
    save_frames_dir: "vision_frames"
    save_frames_max: 1000
  autonomy:
    cooldown_s: 5
    tick_prompt: "Саркастично прокомментируй то, что видишь через камеру. Одно едкое предложение на русском. Не описывай — комментируй."
